<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clockit</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="app">
    <h1 id="time"></h1>
    <h2 id="date"></h2>

    <!-- Alarms -->
    <section id="alarms">
      <h3>Alarms</h3>
      <input type="time" id="alarm-time">
      <button onclick="setAlarm()">Add Alarm</button>
      <ul id="alarm-list"></ul>
    </section>

    <!-- Stopwatch -->
    <section id="stopwatch">
      <h3>Stopwatch</h3>
      <h2 id="stopwatch-display">00:00:00</h2>
      <button onclick="startStopwatch()">Start</button>
      <button onclick="stopStopwatch()">Stop</button>
      <button onclick="resetStopwatch()">Reset</button>
    </section>

    <!-- Timer -->
    <section id="timer">
      <h3>Timer</h3>
      <input type="number" id="timer-minutes" placeholder="Minutes">
      <button onclick="startTimer()">Start Timer</button>
      <h2 id="timer-display">00:00</h2>
    </section>

    <!-- Dynamic Island Popup -->
    <div id="dynamic-island" class="hidden">
      <span id="island-icon"></span>
      <p id="island-text"></p>
      <button onclick="closeIsland()">✕</button>
    </div>

    <!-- Install Button -->
    <button id="install-btn" hidden>Install App</button>
  </div>

  <!-- Audio Elements -->
  <audio id="alarm-sound" src="alarm.mp3" preload="auto"></audio>
  <audio id="timer-sound" src="ding.mp3" preload="auto"></audio>
  <audio id="stopwatch-sound" src="tick.mp3" preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
